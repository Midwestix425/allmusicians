      <h1>Allmusicians</h1>
      <p>Заполни анкету чтобы тебя нашли другие музыканты.</p>
     
      <form id="musicianForm">
           <label>Возраст:</label>
           <input type="number" id="age" required>
           
           <label>Telegram:</label>
           <input type="text" id="Telegram" placeholder="@username" required>

           <label>Стаж (лет)</label>
           <input type="number" id="experience" requiered>

           <label>Город:</label>
           <input type="text" id="city" requiered>
           
           <label>Ник на сайте:</label>
           <input type="text" id="nickname" requiered>

           <label>Инструмент:</label>
           <input type="text" id="instrument"

           <button type="submit">Отправить</button> 
      <form>
       
      <p id="message"></p>
